name: CI

# every push on every branch, plus PRs from forks
on:
  push:
  pull_request:

# a newer commit on the same ref cancels the in-flight run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # required by codegen.ts and the instrumentation.ts boot guard; CI never
  # actually reaches the backend (codegen uses the committed schema).
  BACKEND_GRAPHQL_URL: http://localhost:3001/graphql
  # placeholder auth config so `next build` can collect page data for the
  # nextauth route (its options module throws when no provider is configured).
  AUTH_SECRET: ci-build-only
  NEXTAUTH_SECRET: ci-build-only
  AUTH_GOOGLE_ID: ci-build-only
  AUTH_GOOGLE_SECRET: ci-build-only
  # metadataBase in the team routes does `new URL(process.env.NEXT_BASE_URL ?? '')`
  NEXT_BASE_URL: http://localhost:3000

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint .

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Cross-repo schema drift: regenerate the typed client from the
      # backend's committed schema and fail if graphql/ changed. Needs a PAT
      # with read access to nextplay-be while that repo is private.
      - name: GraphQL types match the backend schema
        if: ${{ env.NEXTPLAY_BE_TOKEN != '' }}
        env:
          NEXTPLAY_BE_TOKEN: ${{ secrets.NEXTPLAY_BE_TOKEN }}
        run: |
          curl -sfL \
            -H "Authorization: token ${NEXTPLAY_BE_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/jacobSalazku/nextplay-be/contents/graphql/schema.graphql?ref=main" \
            -o schema.be.graphql
          pnpm exec graphql-codegen --config codegen.ts --overwrite --schema schema.be.graphql
          rm schema.be.graphql
          git diff --exit-code graphql/graphql.ts graphql/gql.ts

  e2e:
    runs-on: ubuntu-latest
    # Postgres for the backend the `play editor flow` spec drives.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nextplay
          POSTGRES_PASSWORD: nextplay
          POSTGRES_DB: nextplay_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextplay"
          --health-interval 1s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://nextplay:nextplay@localhost:5432/nextplay_e2e
      E2E_BACKEND_DIR: ${{ github.workspace }}/nextplay-be
    steps:
      - uses: actions/checkout@v4
      - name: Check out nextplay-be
        uses: actions/checkout@v4
        with:
          repository: jacobSalazku/nextplay-be
          ref: main
          path: nextplay-be

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Install backend deps
        working-directory: nextplay-be
        run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: Playwright
        # playwright.config.ts boots nextplay-be via e2e/start-backend.sh
        # because E2E_BACKEND_DIR is set.
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
