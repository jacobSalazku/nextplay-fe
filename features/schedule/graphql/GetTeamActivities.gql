query GetTeamActivities($routeKey: String!) {
  getTeamActivities(routeKey: $routeKey) {
    id
    name
    code
    slug
    routeKey
    shortId
    image
    ageGroup
    createdAt
    updatedAt
    creatorId
    members {
      id
      name
      image
      teamId
      userId
    }
    activities {
      id
      teamId
      type
      title
      time
      duration
      date
      createdAt
      updatedAt
      attendees {
        id
        activityId
        memberId
        attendanceStatus
        reason
        createdAt
        updatedAt
      }
    }
  }
}
